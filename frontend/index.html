<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitalGuard AI — Space Debris Tracking</title>
    <meta name="description" content="Real-time AI-powered Space Situational Awareness system for LEO debris tracking and collision prevention.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- LEFT — Controls -->
    <div id="left-panel" class="panel">
        <div class="brand">
            <div class="brand-icon">🛰</div>
            <div>
                <h1>OrbitalGuard AI</h1>
                <div class="brand-sub">Space Situational Awareness</div>
            </div>
        </div>

        <div class="control-group">
            <label>Search Object</label>
            <input type="text" class="search-input" id="searchInput" placeholder="Enter NORAD ID...">
        </div>

        <div class="control-group">
            <label>Simulation Speed</label>
            <input type="range" id="speedSlider" min="1" max="100" value="10">
        </div>

        <div class="control-group">
            <div class="toggle-row"><span>Show Payloads</span><input type="checkbox" id="togglePayload" checked></div>
            <div class="toggle-row"><span>Show Debris</span><input type="checkbox" id="toggleDebris" checked></div>
            <div class="toggle-row"><span>Show Collision Zones</span><input type="checkbox" id="toggleZones" checked></div>
        </div>
    </div>

    <!-- RIGHT — Legend -->
    <div id="right-panel" class="panel">
        <h3>Object Legend</h3>
        <div class="legend-item"><div class="dot payload"></div> Active Payload</div>
        <div class="legend-item"><div class="dot debris"></div> Debris Fragment</div>
        <div class="legend-item"><div class="dot rocket"></div> Rocket Body</div>
        <div class="legend-item"><div class="dot danger"></div> Collision Zone</div>
    </div>

    <!-- BOTTOM — Metrics -->
    <div id="bottom-panel" class="panel">
        <div class="metric">
            <div class="metric-value color-cyan" id="obj-count">0</div>
            <div class="metric-label">Objects Tracked</div>
        </div>
        <div class="metric">
            <div class="metric-value color-red" id="risk-count">0</div>
            <div class="metric-label">High-Risk Events</div>
        </div>
        <div class="metric">
            <div class="metric-value color-green" id="latency">— ms</div>
            <div class="metric-label">WS Latency</div>
        </div>
    </div>

    <!-- STATUS BAR -->
    <div id="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="main.js"></script>
</body>
</html>
